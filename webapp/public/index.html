<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gene variant oncogenicity — PubMed evidence</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Gene variant oncogenicity</h1>
    <p class="sub">Evidence from PMC full-text literature · validated verbatim quotes</p>
    <p id="stats" class="stats">Loading data…</p>
  </header>
  <main class="layout">
    <aside class="panel">
      <label for="gene-search">Gene</label>
      <input id="gene-search" type="search" placeholder="e.g. BRAF, TP53" autocomplete="off" />
      <ul id="gene-list" class="gene-list"></ul>
      <label for="variant-select">Variant</label>
      <select id="variant-select" disabled><option>Select a gene first</option></select>
    </aside>
    <section class="panel detail" id="detail">
      <p class="placeholder">Loading…</p>
    </section>
  </main>
  <footer><p>Automated extraction from PubMed/PMC. For research use; not clinical advice.</p></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

# Deploy on https://render.com — connect GitHub repo, Render reads this file.
services:
  - type: web
    name: pubmed-oncogenicity-viewer
    runtime: python
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    plan: free
    healthCheckPath: /api/stats
